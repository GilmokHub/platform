name: Build & Push Platform Frontend to GHCR

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'backend/**'
      - 'sdk/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/platform-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ secrets.OCI_PLATFORM_URL }}
            VITE_AUTH_BASE_URL=${{ secrets.OCI_PLATFORM_URL }}
            VITE_GRAFANA_BASE_URL=${{ secrets.OCI_GRAFANA_URL }}
            VITE_GRAFANA_DASHBOARD_UID=${{ secrets.VITE_GRAFANA_DASHBOARD_UID }}

      - name: Trigger Deploy Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITOPS_TOKEN }}
          repository: GilmokHub/deploy
          event-type: update-image
          client-payload: '{"image_tag": "latest", "image_url": "${{ env.IMAGE_NAME }}", "service_name": "platform-frontend", "target": "oci"}'
